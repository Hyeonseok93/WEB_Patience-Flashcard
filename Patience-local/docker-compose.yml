# 로컬 개발용. 공개 서비스로 올릴 때:
# - SPRING_PROFILES_ACTIVE=prod
# - JWT_SECRET / POSTGRES_PASSWORD 고유 값
# - JWT_COOKIE_SECURE=true (HTTPS)
# - Mailhog 서비스 제거, 실제 SMTP
# - frontend 80 대신 443 + TLS
# - 5432/8080/8025 호스트 포트는 열지 않기
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patience}
      POSTGRES_USER: ${POSTGRES_USER:-patience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patience-local-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patience} -d ${POSTGRES_DB:-patience}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../Patience-backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-patience}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-patience}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-patience-local-change-me}
      JWT_SECRET: ${JWT_SECRET:-patience-local-jwt-secret-change-me-32b}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: "1025"
      APP_MAIL_FROM: Patience <patience@localhost>
      # APP_PUBLIC_BASE_URL: https://your-domain
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

  # 로컬 인증 메일 확인용. 공개 서비스에서는 이 블록을 빼고 실제 SMTP 쓰기.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"

  frontend:
    build:
      context: ../Patience-frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
