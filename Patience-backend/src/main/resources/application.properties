spring.application.name=patience-flashcard

server.port=8080
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/patience}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:patience}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:patience-local-change-me}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# 공개 서비스: SPRING_PROFILES_ACTIVE=prod + 고유 JWT_SECRET(32자 이상). 기본값은 로컬 전용.
app.jwt.secret=${JWT_SECRET:patience-local-jwt-secret-change-me-32b}
app.jwt.cookie-name=PATIENCE_TOKEN
# 공개 서비스(HTTPS): JWT_COOKIE_SECURE=true
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.jwt.expiration-ms=86400000

# 로컬: Mailhog (localhost:1025). 공개 서비스: 실제 SMTP + auth/starttls 켜기.
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
# spring.mail.username=${SPRING_MAIL_USERNAME:}
# spring.mail.password=${SPRING_MAIL_PASSWORD:}

app.mail.from=${APP_MAIL_FROM:Patience <patience@localhost>}
# 공개 서비스: 인증 링크를 다시 쓸 때 사이트 주소.
# app.mail.public-base-url=${APP_PUBLIC_BASE_URL:https://your-domain}

app.import.max-bytes=2097152
app.import.max-rows=5000

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
