# 공개 서비스: SPRING_PROFILES_ACTIVE=prod
# 기본 JWT/DB 비밀번호로 기동하지 않음. 호스트에서 반드시 설정.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
app.jwt.secret=${JWT_SECRET}
# HTTPS 뒤에서만 true. HTTP면 쿠키가 안 붙음.
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

